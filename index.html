<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Running Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1>🏃 Running Tracker</h1>

  <div class="stats">
    <div>
      <span class="label">Distancia</span>
      <strong id="km">0.00</strong> km
    </div>

    <div>
      <span class="label">Tiempo</span>
      <strong id="time">00:00</strong>
    </div>

    <div>
      <span class="label">Ritmo</span>
      <strong id="pace">--</strong> min/km
    </div>
  </div>

  <div class="controls">
    <button onclick="startRun()">▶ Start</button>
    <button onclick="stopRun()">⏹ Stop</button>
  </div>

  <canvas id="resultCanvas" width="800" height="400"></canvas>

  <button class="share" onclick="share()">📤 Compartir resultado</button>
</div>

<script src="app.js"></script>
</body>
</html>
