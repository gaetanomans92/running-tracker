

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Running Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0f0f14;--panel:#1a1a24;--border:#252535;
      --accent:#FC4C02;--accent2:#ff8c42;--warn:#ffd600;
      --danger:#f44336;--text:#f0f0f5;--sub:#8892a4;--r:12px;
    }
    html{height:100%}
    body{
      height:100%;width:100%;
      font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
      background:var(--bg);color:var(--text);
      overflow:hidden;position:fixed;
      -webkit-tap-highlight-color:transparent;
    }
    #app{display:grid;grid-template-rows:auto 1fr auto auto;height:100%}

    header{
      display:flex;align-items:center;justify-content:space-between;
      padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));
      background:var(--panel);border-bottom:1px solid var(--border);gap:8px;
    }
    .hd-left{display:flex;align-items:center;gap:7px;flex-shrink:0}
    header h1{font-size:14px;font-weight:800;letter-spacing:1px;color:var(--accent)}
    #status-dot{width:8px;height:8px;border-radius:50%;background:var(--sub);
      transition:background .4s;flex-shrink:0}
    #status-dot.active{background:var(--accent);box-shadow:0 0 6px var(--accent);animation:blink 1.4s infinite}
    #status-dot.paused{background:var(--warn);box-shadow:0 0 6px var(--warn)}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    #timer{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;
      letter-spacing:1px;color:var(--text);flex-shrink:0}
    .hd-right{font-size:10px;color:var(--sub);text-align:right;line-height:1.8;min-width:56px}
    #voice-state{cursor:pointer;-webkit-user-select:none;user-select:none}

    #map-wrap{position:relative;min-height:0}
    #map{width:100%;height:100%}
    #gps-overlay{
      display:none;position:absolute;inset:0;z-index:800;
      background:rgba(10,10,15,.72);
      backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
      flex-direction:column;align-items:center;justify-content:center;gap:10px;
    }
    #gps-overlay.show{display:flex}
    .spinner{width:42px;height:42px;border-radius:50%;
      border:3px solid var(--border);border-top-color:var(--accent);
      animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #gps-overlay p{color:var(--accent);font-size:13px;font-weight:600}

    #pace-card{
      position:absolute;top:10px;right:10px;
      background:rgba(10,10,15,.86);border:1px solid var(--border);
      border-radius:var(--r);padding:7px 11px;z-index:500;
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-width:100px;
    }
    .pc-val{font-size:19px;font-weight:800;color:var(--accent2);font-variant-numeric:tabular-nums}
    .pc-label{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--sub)}
    #btn-center{
      position:absolute;top:10px;left:10px;z-index:500;
      width:38px;height:38px;border-radius:50%;border:1px solid var(--border);
      background:rgba(10,10,15,.86);color:var(--text);font-size:18px;
      display:flex;align-items:center;justify-content:center;cursor:pointer;
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);-webkit-appearance:none;
    }

    #stats{
      display:grid;grid-template-columns:repeat(4,1fr);
      background:var(--panel);border-top:1px solid var(--border);padding:6px 2px 8px;
    }
    .stat{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 2px}
    .stat-val{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
    .stat-unit{font-size:9px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px}
    .stat-label{font-size:9px;color:var(--sub)}
    .stat.orange .stat-val{color:var(--accent)}
    .stat.amber  .stat-val{color:var(--accent2)}
    .stat.warn   .stat-val{color:var(--warn)}
    .stat.heart  .stat-val{color:#ff4d6d}

    #controls{
      display:flex;align-items:center;justify-content:center;gap:9px;
      padding:7px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));
      background:var(--panel);border-top:1px solid var(--border);
    }
    .btn{
      flex:1;max-width:148px;padding:11px 6px;border:none;border-radius:50px;
      font-size:14px;font-weight:700;cursor:pointer;
      -webkit-appearance:none;transition:transform .1s;letter-spacing:.2px;
    }
    .btn:active{transform:scale(.93)}
    #btn-start{background:var(--accent);color:#fff}
    #btn-pause{background:var(--warn);color:#000;display:none}
    #btn-stop {background:var(--danger);color:#fff;display:none}
    #btn-hr{
      flex:none;width:46px;height:46px;border-radius:50%;
      background:rgba(255,77,109,.12);color:#ff4d6d;
      font-size:20px;border:1px solid rgba(255,77,109,.35);
      display:flex;align-items:center;justify-content:center;
    }

    #voice-badge{
      position:fixed;top:64px;left:50%;
      transform:translateX(-50%) translateY(-10px);
      background:rgba(0,0,0,.92);border:1px solid var(--accent);
      color:var(--accent);padding:6px 15px;border-radius:50px;
      font-size:12px;font-weight:600;opacity:0;
      transition:opacity .28s,transform .28s;pointer-events:none;
      z-index:9999;max-width:86vw;text-align:center;
    }
    #voice-badge.show{opacity:1;transform:translateX(-50%) translateY(0)}

    #hr-modal{
      display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);
      z-index:9000;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    }
    #hr-modal.show{display:flex}
    #hr-wrap{position:relative;width:144px;height:144px;border-radius:50%;
      overflow:hidden;border:4px solid #ff4d6d;flex-shrink:0}
    #hr-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    #hr-canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0}
    #hr-bpm{font-size:56px;font-weight:900;color:#ff4d6d;line-height:1;font-variant-numeric:tabular-nums}
    #hr-msg{color:var(--sub);font-size:13px;text-align:center;max-width:230px;line-height:1.5}
    #hr-close{padding:12px 34px;border-radius:50px;border:none;
      background:var(--border);color:var(--text);font-size:14px;
      font-weight:700;cursor:pointer;-webkit-appearance:none}

    #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.84);
      z-index:9000;align-items:center;justify-content:center}
    #modal.show{display:flex}
    #modal-card{background:var(--panel);border:1px solid var(--border);
      border-radius:18px;padding:22px 18px;width:86%;max-width:330px;text-align:center}
    #modal-card h2{font-size:17px;margin-bottom:14px;color:var(--accent)}
    .mrow{display:flex;justify-content:space-between;padding:8px 0;
      border-bottom:1px solid var(--border);font-size:13px}
    .mrow span:first-child{color:var(--sub)}
    .mrow span:last-child{font-weight:700}
    #modal-share{
      margin-top:14px;width:100%;padding:12px;border-radius:50px;
      border:1px solid rgba(252,76,2,.4);background:rgba(252,76,2,.12);
      color:var(--accent);font-size:14px;font-weight:700;
      cursor:pointer;-webkit-appearance:none;display:block;
    }
    #modal-close{
      margin-top:8px;width:100%;padding:12px;border-radius:50px;
      border:none;background:var(--accent);color:#fff;font-size:14px;
      font-weight:700;cursor:pointer;-webkit-appearance:none;
    }

    .maplibregl-ctrl-bottom-right{right:8px;bottom:max(8px,env(safe-area-inset-bottom))!important}
    .maplibregl-ctrl-group{
      background:rgba(26,26,36,.9)!important;
      border:1px solid var(--border)!important;border-radius:8px!important;
    }
    .maplibregl-ctrl-group button{background:transparent!important}
    .maplibregl-ctrl-group button svg path{fill:var(--text)!important}
    .maplibregl-ctrl-attrib{font-size:9px!important;background:rgba(0,0,0,.45)!important;color:rgba(255,255,255,.55)!important}
    .maplibregl-ctrl-attrib a{color:rgba(255,255,255,.55)!important}
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="hd-left">
      <div id="status-dot"></div>
      <h1>&#x1F3C3; RUNNING</h1>
    </div>
    <div id="timer">00:00:00</div>
    <div class="hd-right">
      <div id="gps-acc">GPS –</div>
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:5px">
        <span id="lock-icon" style="font-size:11px">🔓</span>
        <div id="voice-state">&#x1F50A; Voz</div>
      </div>
    </div>
  </header>

  <div id="map-wrap">
    <div id="map"></div>
    <div id="gps-overlay"><div class="spinner"></div><p>Buscando GPS…</p></div>
    <button id="btn-center" onclick="recenter()" title="Centrar">&#x1F3AF;</button>
    <div id="pace-card">
      <div class="pc-label">Ritmo</div>
      <div class="pc-val" id="pace-val">–'–"</div>
      <div class="pc-label">min / km</div>
    </div>
  </div>

  <div id="stats">
    <div class="stat orange"><div class="stat-val" id="s-km">0.00</div><div class="stat-unit">km</div><div class="stat-label">Distancia</div></div>
    <div class="stat amber"><div class="stat-val" id="s-speed">0.0</div><div class="stat-unit">km/h</div><div class="stat-label">Velocidad</div></div>
    <div class="stat warn"><div class="stat-val" id="s-cal">0</div><div class="stat-unit">kcal</div><div class="stat-label">Calorías</div></div>
    <div class="stat heart"><div class="stat-val" id="s-bpm">–</div><div class="stat-unit">bpm</div><div class="stat-label">&#x2665; Pulso</div></div>
  </div>

  <div id="controls">
    <button class="btn" id="btn-start" onclick="startRun()">&#x25B6; Iniciar</button>
    <button class="btn" id="btn-pause" onclick="pauseRun()">&#x23F8; Pausa</button>
    <button class="btn" id="btn-stop"  onclick="stopRun()">&#x23F9; Fin</button>
    <button class="btn" id="btn-hr"    onclick="openHR()">&#x2665;</button>
  </div>
</div>

<div id="voice-badge"></div>

<div id="hr-modal">
  <div id="hr-wrap">
    <video id="hr-video" autoplay playsinline muted></video>
    <canvas id="hr-canvas" width="144" height="144"></canvas>
  </div>
  <div id="hr-bpm">–</div>
  <div id="hr-msg">Cubre la cámara trasera con el dedo.<br>Mantén presionado suavemente.</div>
  <button id="hr-close" onclick="closeHR()">Cerrar</button>
</div>

<div id="modal">
  <div id="modal-card">
    <h2>&#x1F3C6; Resumen</h2>
    <div class="mrow"><span>Distancia</span>  <span id="m-km">–</span></div>
    <div class="mrow"><span>Tiempo</span>      <span id="m-time">–</span></div>
    <div class="mrow"><span>Ritmo medio</span> <span id="m-pace">–</span></div>
    <div class="mrow"><span>Vel. máxima</span> <span id="m-maxspeed">–</span></div>
    <div class="mrow"><span>Calorías</span>    <span id="m-cal">–</span></div>
    <div class="mrow"><span>Pulso medio</span> <span id="m-bpm">–</span></div>
    <button id="modal-share" onclick="shareResult()">&#x1F4E4; Compartir resultado</button>
    <button id="modal-close" onclick="closeModal()">Cerrar</button>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script>
// ─────────────────────────────────────────────────────────
// CONFIG — pega la URL de tu Google Apps Script aquí:
// ─────────────────────────────────────────────────────────
const GAS_URL = '';
// (si está vacío, simplemente no guarda en Sheets)

// ─────────────────────────────────────────────────────────
// Estado
// ─────────────────────────────────────────────────────────
const S = {
  running:false, paused:false, startTime:null, elapsed:0,
  km:0, speed:0, maxSpeed:0, bpm:null, bpmSum:0, bpmCount:0,
  positions:[], watchId:null, timerIv:null,
  lastKmAnn:0, lastBpmAnn:null,
  voiceEnabled:true, voiceReady:false,
};
const WEIGHT = 70;
let lastPos = null;
let lastRunData = null;

// ─────────────────────────────────────────────────────────
// Mapa — MapLibre GL + ESRI Satellite + terreno 3D
// ─────────────────────────────────────────────────────────
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      satellite: {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256, attribution: '© Esri, Maxar, Earthstar Geographics'
      },
      labels: {
        type: 'raster',
        tiles: ['https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256
      }
    },
    layers: [
      { id: 'satellite', type: 'raster', source: 'satellite' },
      { id: 'labels',    type: 'raster', source: 'labels', paint: { 'raster-opacity': 0.85 } }
    ]
  },
  center: [-3.7038, 40.4168], zoom: 15, pitch: 50, bearing: 0, attributionControl: true
});
map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'bottom-right');

let mapLoaded = false, marker = null, markerEl = null;

map.on('load', () => {
  mapLoaded = true;
  try {
    map.addSource('terrain', {
      type: 'raster-dem',
      tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
      encoding: 'terrarium', tileSize: 256
    });
    map.setTerrain({ source: 'terrain', exaggeration: 1.5 });
  } catch(_) {}
  map.addSource('route', { type: 'geojson', data: emptyLine() });
  map.addLayer({ id: 'route-glow', type: 'line', source: 'route',
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': '#FC4C02', 'line-width': 18, 'line-opacity': 0.18, 'line-blur': 8 } });
  map.addLayer({ id: 'route-line', type: 'line', source: 'route',
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': '#FC4C02', 'line-width': 5, 'line-opacity': 0.95 } });
});

function emptyLine() { return { type:'Feature', geometry:{ type:'LineString', coordinates:[] } }; }
function updateRoute() {
  if (!mapLoaded) return;
  map.getSource('route').setData({ type:'Feature', geometry:{ type:'LineString', coordinates: S.positions.map(p=>[p.ln,p.la]) } });
}
function clearRoute() { if (mapLoaded) map.getSource('route').setData(emptyLine()); }

function buildMarkerEl() {
  const el = document.createElement('div');
  el.style.cssText = 'width:36px;height:36px;pointer-events:none';
  el.innerHTML = `<div style="width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:26px solid #FC4C02;margin:0 auto;filter:drop-shadow(0 0 6px rgba(252,76,2,.9))"></div><div style="width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid #FC4C02;margin:0 auto;box-shadow:0 0 6px #FC4C02"></div>`;
  return el;
}
function moveMkr(la, ln, hd) {
  const rot = (hd != null && !isNaN(hd) && hd >= 0) ? hd : 0;
  if (!marker) {
    markerEl = buildMarkerEl();
    marker = new maplibregl.Marker({ element:markerEl, rotationAlignment:'map' }).setLngLat([ln,la]).setRotation(rot).addTo(map);
  } else { marker.setLngLat([ln,la]); marker.setRotation(rot); }
}
function setView(la, ln) {
  const zoom = map.getZoom() < 15 ? 17 : map.getZoom();
  map.easeTo({ center:[ln,la], zoom, pitch:50, duration:800 });
}
function recenter() { if (lastPos) setView(lastPos.la, lastPos.ln); }

// ─────────────────────────────────────────────────────────
// Haversine / tiempo
// ─────────────────────────────────────────────────────────
function hav(a,b,c,d) {
  const R=6371, p=Math.PI/180;
  const x=Math.sin((c-a)*p/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin((d-b)*p/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function eSec() { return (S.elapsed+(S.startTime?Date.now()-S.startTime:0))/1000; }
function fmt(s) {
  s=Math.floor(s);
  return [Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(n=>String(n).padStart(2,'0')).join(':');
}
function paceStr(kmh) {
  if (!kmh||kmh<0.5) return "–'–\"";
  const t=3600/kmh, m=Math.floor(t/60), s=String(Math.floor(t%60)).padStart(2,'0');
  return `${m}'${s}"`;
}
function calcCal() { return Math.round(8*WEIGHT*(eSec()/3600)); }

// ─────────────────────────────────────────────────────────
// GPS
// ─────────────────────────────────────────────────────────
function startGPS() {
  if (S.watchId!=null) return;
  document.getElementById('gps-overlay').classList.add('show');
  S.watchId = navigator.geolocation.watchPosition(onPos, onGpsErr, { enableHighAccuracy:true, maximumAge:3000, timeout:20000 });
}
function stopGPS() {
  if (S.watchId!=null) { navigator.geolocation.clearWatch(S.watchId); S.watchId=null; }
  document.getElementById('gps-overlay').classList.remove('show');
}
function onPos(p) {
  const { latitude:la, longitude:ln, accuracy:ac, speed:gs, heading:hd } = p.coords;
  document.getElementById('gps-overlay').classList.remove('show');
  document.getElementById('gps-acc').textContent = `±${Math.round(ac)}m`;
  if (ac>250 && S.positions.length>2) return;
  lastPos = { la, ln };
  let kmh = (gs!=null && gs>=0) ? gs*3.6 : 0;
  if (S.running && S.positions.length>0) {
    const pv = S.positions[S.positions.length-1];
    const d = hav(pv.la,pv.ln,la,ln);
    if (d>0.004) S.km += d;
    if (gs==null) { const dt=(Date.now()-pv.ts)/1000; kmh = dt>0?(d/dt)*3600:0; }
  }
  if (kmh>=0 && kmh<80) S.speed = kmh;
  if (S.speed>S.maxSpeed) S.maxSpeed = S.speed;
  moveMkr(la,ln,hd); setView(la,ln);
  if (!S.running) return;
  S.positions.push({ la,ln,ts:Date.now() });
  updateRoute();
  document.getElementById('s-km').textContent     = S.km.toFixed(2);
  document.getElementById('s-speed').textContent  = S.speed.toFixed(1);
  document.getElementById('pace-val').textContent = paceStr(S.speed);
  voiceCheck();
}
function onGpsErr(e) {
  const msg={1:'Sin permiso GPS',2:'GPS no disponible',3:'GPS tardó mucho'};
  document.getElementById('gps-acc').textContent = msg[e.code]||'GPS error';
  document.getElementById('gps-overlay').classList.remove('show');
}

// ─────────────────────────────────────────────────────────
// VOZ HUMANA — frases variadas, detección de tendencia
// ─────────────────────────────────────────────────────────
function primeVoice() {
  if (S.voiceReady) return;
  const u = new SpeechSynthesisUtterance(''); u.volume=0; u.lang='es-ES';
  window.speechSynthesis.speak(u); S.voiceReady=true;
}
setInterval(() => {
  if (S.voiceEnabled && window.speechSynthesis.paused) window.speechSynthesis.resume();
}, 10000);

function speak(txt) {
  if (!S.voiceEnabled) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang='es-ES'; u.rate=1.05;
  window.speechSynthesis.speak(u);
  showBadge(txt);
}
function showBadge(txt) {
  const b = document.getElementById('voice-badge');
  b.textContent=txt; b.classList.add('show');
  clearTimeout(b._t); b._t=setTimeout(()=>b.classList.remove('show'),4500);
}
function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

const FRASES = {
  inicio: [
    'Carrera iniciada. ¡Vamos a por ello, tú puedes con todo!',
    '¡Empezamos! Respira hondo y corre. ¡Hoy es tu día!',
    '¡A correr! Cada paso cuenta. ¡Demuéstrate lo que vales!',
    '¡Arrancamos! No pares hasta que estés orgulloso. ¡Vamos!',
  ],
  pausa: [
    'Carrera pausada. Descansa un momento, te lo has ganado.',
    'Pausado. Aprovecha para recuperar el aliento.',
    'Pausa activa. Vuelves enseguida, no pierdas el calor.',
  ],
  reanudar: [
    '¡De vuelta a la carrera! ¡Sin excusas, a por ello!',
    '¡Continuamos! ¡No dejes que el cuerpo se enfríe, vamos!',
    '¡Arrancamos de nuevo! Tú puedes, lo sé.',
  ],
  fin: (km, time, pace) => [
    `¡Carrera finalizada! ${km} kilómetros en ${time}. Ritmo ${pace}. ¡Eres un campeón!`,
    `¡Lo lograste! ${km} kilos en ${time} a ${pace} el kilómetro. ¡Increíble trabajo!`,
    `¡Terminaste! ${km} kilómetros. Tiempo ${time}. ¡Orgullo total, enhorabuena!`,
  ],
  km: (km, min, pace) => [
    `¡Kilómetro ${km}! Llevas ${min} minutos. Ritmo ${pace}. ¡Imparable!`,
    `¡${km} kilómetros completados! ${min} minutos en las piernas. Ritmo ${pace}. ¡Crack!`,
    `¡Kilo ${km} superado! ${min} minutos sin parar. ¡No te detengas ahora!`,
    `¡${km} kilos! Llevas ${min} minutos volando. Ritmo ${pace}. ¡Sigue así!`,
  ],
  bajando: [
    '¡Vamos, no te rindas! Sé que puedes dar más.',
    '¡Aprieta esas piernas! No dejes que el cansancio gane.',
    '¡Ánimo! Recuerda por qué empezaste a correr.',
    '¡Dale! Un poco más de gas, ¡tú puedes con esto!',

// Cooldowns y tendencia de velocidad
const VC = { prevSpeed:0, prevZone:null, lastPaceAt:0, lastTimeAt:0, lastBpmAt:0 };

function zoneOf(kmh) {
  if (kmh<4) return 'caminando';
  if (kmh<7) return 'trote';
  if (kmh<10) return 'suave';
  if (kmh<13) return 'medio';
  if (kmh<16) return 'rapido';
  return 'sprint';
}

function voiceCheck() {
  const now = Date.now();
  const sec = eSec();
  const sp  = S.speed;
  const km  = S.km;

  // Hito de kilómetro (siempre anuncia)
  const mi = Math.floor(km);
  if (mi>0 && mi>S.lastKmAnn) {
    S.lastKmAnn = mi;
    speak(pick(FRASES.km(mi, Math.floor(sec/60), paceStr(sp))));
    VC.lastPaceAt = now;
    return;
  }

  // Tendencia de velocidad
  const diff = sp - VC.prevSpeed;
  VC.prevSpeed = sp;
  const z = sp>=0.5 ? zoneOf(sp) : null;

  // Comentario de ritmo (cooldown 32s)
  if (sp>=0.5 && sec>20 && now-VC.lastPaceAt>32000) {
    let phrase = null;
    if (diff < -0.9)              phrase = pick(FRASES.bajando);
    else if (diff > 0.9)          phrase = pick(FRASES.subiendo);
    else if (z && z!==VC.prevZone) phrase = pick(FRASES.zonas[z]);
    if (phrase) { speak(phrase); VC.lastPaceAt=now; VC.prevZone=z; }
  }

  // Ánimo cada 5 minutos
  const minEl = Math.floor(sec/60);
  if (minEl>0 && minEl%5===0 && sec%60<6 && now-VC.lastTimeAt>290000) {
    speak(pick(FRASES.tiempo(minEl, km)));
    VC.lastTimeAt = now;
  }

  // BPM (cooldown 60s)
  if (S.bpm && now-VC.lastBpmAt>60000) {
    if (S.bpm>180 && S.lastBpmAnn!=='hi') {
      speak(pick(FRASES.bpmAlto)); S.lastBpmAnn='hi'; VC.lastBpmAt=now;
    } else if (S.bpm<130 && S.lastBpmAnn!=='lo') {
      speak(pick(FRASES.bpmBajo)); S.lastBpmAnn='lo'; VC.lastBpmAt=now;
    } else if (S.bpm>=130 && S.bpm<=180) {
      S.lastBpmAnn=null;
    }
  }
}

// ─────────────────────────────────────────────────────────
// Pantalla siempre encendida
// ─────────────────────────────────────────────────────────
let wakeLock=null, audioCtx=null, gainNode=null;

async function enableScreenOn() {
  if ('wakeLock' in navigator) {
    try { wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); } catch(_){}
  }
  try {
    if (!audioCtx) { audioCtx=new(window.AudioContext||window.webkitAudioContext)(); gainNode=audioCtx.createGain(); gainNode.gain.value=0.001; gainNode.connect(audioCtx.destination); }
    if (audioCtx.state==='suspended') await audioCtx.resume();
    const buf=audioCtx.createBuffer(1,audioCtx.sampleRate,audioCtx.sampleRate);
    const src=audioCtx.createBufferSource(); src.buffer=buf; src.loop=true; src.connect(gainNode); src.start();
    enableScreenOn._src=src;
  } catch(_){}
  updateLockIcon(true);
}
function disableScreenOn() {
  if (wakeLock){wakeLock.release();wakeLock=null;}
  try { if(enableScreenOn._src){enableScreenOn._src.stop();enableScreenOn._src=null;} if(audioCtx)audioCtx.suspend(); } catch(_){}
  updateLockIcon(false);
}
function updateLockIcon(on) { const el=document.getElementById('lock-icon'); if(el)el.textContent=on?'🔒':'🔓'; }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&S.running)enableScreenOn(); });

// ─────────────────────────────────────────────────────────
// Controles
// ─────────────────────────────────────────────────────────
function startRun() {
  primeVoice();
  if (S.paused) {
    S.startTime=Date.now(); S.paused=false; S.running=true;
    document.getElementById('status-dot').className='active';
    document.getElementById('btn-pause').style.display='';
    document.getElementById('btn-start').style.display='none';
    S.timerIv=setInterval(tick,500);
    startGPS(); enableScreenOn();
    speak(pick(FRASES.reanudar));
    return;
  }
  Object.assign(S,{
    running:true, paused:false, startTime:Date.now(), elapsed:0,
    km:0, speed:0, maxSpeed:0, positions:[],
    lastKmAnn:0, lastBpmAnn:null,
    bpmSum:0, bpmCount:0, bpm:null,
  });
  Object.assign(VC,{ prevSpeed:0, prevZone:null, lastPaceAt:0, lastTimeAt:0, lastBpmAt:0 });
  clearRoute();
  document.getElementById('s-km').textContent='0.00';
  document.getElementById('s-speed').textContent='0.0';
  document.getElementById('s-bpm').textContent='–';
  document.getElementById('pace-val').textContent="–'–\"";
  document.getElementById('btn-start').style.display='none';
  document.getElementById('btn-pause').style.display='';
  document.getElementById('btn-stop').style.display='';
  document.getElementById('status-dot').className='active';
  S.timerIv=setInterval(tick,500);
  startGPS(); enableScreenOn();
  speak(pick(FRASES.inicio));
}

function pauseRun() {
  S.elapsed+=Date.now()-S.startTime; S.startTime=null;
  S.paused=true; S.running=false;
  clearInterval(S.timerIv); stopGPS(); disableScreenOn();
  document.getElementById('status-dot').className='paused';
  document.getElementById('btn-pause').style.display='none';
  document.getElementById('btn-start').textContent='▶ Reanudar';
  document.getElementById('btn-start').style.display='';
  speak(pick(FRASES.pausa));
}

function stopRun() {
  if (S.startTime) S.elapsed+=Date.now()-S.startTime;
  S.startTime=null; S.running=false; S.paused=false;
  clearInterval(S.timerIv); stopGPS(); disableScreenOn();

  document.getElementById('status-dot').className='';
  document.getElementById('btn-start').textContent='▶ Iniciar';
  document.getElementById('btn-start').style.display='';
  document.getElementById('btn-pause').style.display='none';
  document.getElementById('btn-stop').style.display='none';

  const sec     = S.elapsed/1000;
  const avgPace = S.km>0 ? paceStr(S.km/(sec/3600)) : '–';
  const avgBpm  = S.bpmCount>0 ? Math.round(S.bpmSum/S.bpmCount)+' bpm' : '–';
  const calVal  = calcCal();

  document.getElementById('m-km').textContent       = S.km.toFixed(2)+' km';
  document.getElementById('m-time').textContent     = fmt(sec);
  document.getElementById('m-pace').textContent     = avgPace+' /km';
  document.getElementById('m-maxspeed').textContent = S.maxSpeed.toFixed(1)+' km/h';
  document.getElementById('m-cal').textContent      = calVal+' kcal';
  document.getElementById('m-bpm').textContent      = avgBpm;
  document.getElementById('modal').classList.add('show');

  // Guardar datos para imagen y Sheets
  lastRunData = {
    date: new Date().toLocaleString('es-ES',{dateStyle:'long',timeStyle:'short'}),
    km:   S.km.toFixed(2),
    time: fmt(sec),
    pace: avgPace,
    maxSpeed: S.maxSpeed.toFixed(1),
    cal:  calVal,
    bpm:  avgBpm,
    positions: [...S.positions],
  };

  saveToSheets(lastRunData);
  speak(pick(FRASES.fin(S.km.toFixed(2), fmt(sec), avgPace)));
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

function tick() {
  document.getElementById('timer').textContent = fmt(eSec());
  document.getElementById('s-cal').textContent = calcCal();
}

document.getElementById('voice-state').addEventListener('click',()=>{
  primeVoice();
  S.voiceEnabled=!S.voiceEnabled;
  document.getElementById('voice-state').textContent=S.voiceEnabled?'🔊 Voz':'🔇 Silencio';
  if(S.voiceEnabled) speak('Voz activada');
});

// ─────────────────────────────────────────────────────────
// Google Sheets (vía Google Apps Script)
// ─────────────────────────────────────────────────────────
async function saveToSheets(data) {
  if (!GAS_URL) return;
  try {
    const params = new URLSearchParams({
      date:     data.date,
      km:       data.km,
      time:     data.time,
      pace:     data.pace,
      maxSpeed: data.maxSpeed,
      cal:      data.cal,
      bpm:      data.bpm,
    });
    await fetch(`${GAS_URL}?${params}`, { mode:'no-cors' });
  } catch(_) {}
}

// ─────────────────────────────────────────────────────────
// Imagen resultado — canvas manual estilo Strava
// ─────────────────────────────────────────────────────────
function generateResultImage(data) {
  const W=800, H=480;
  const cvs=document.createElement('canvas');
  cvs.width=W; cvs.height=H;
  const ctx=cvs.getContext('2d');

  // Fondo
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a1a24'); bg.addColorStop(1,'#0f0f14');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Franjas naranja
  ctx.fillStyle='#FC4C02'; ctx.fillRect(0,0,W,6);
  ctx.fillStyle='#FC4C02'; ctx.fillRect(0,0,5,H);

  // Título
  ctx.fillStyle='#FC4C02'; ctx.font='bold 20px Arial,sans-serif';
  ctx.fillText('RUNNING TRACKER', 28, 42);
  ctx.fillStyle='#8892a4'; ctx.font='14px Arial,sans-serif';
  ctx.fillText(data.date, 28, 64);

  // Divisor
  ctx.strokeStyle='#252535'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(28,78); ctx.lineTo(W-28,78); ctx.stroke();

  // Distancia principal
  ctx.fillStyle='#FC4C02'; ctx.font='bold 86px Arial,sans-serif';
  ctx.fillText(data.km, 28, 185);
  ctx.fillStyle='#8892a4'; ctx.font='bold 16px Arial,sans-serif';
  ctx.fillText('KILOMETROS', 28, 210);

  // Tiempo (derecha de distancia)
  ctx.fillStyle='#f0f0f5'; ctx.font='bold 50px Arial,sans-serif';
  ctx.fillText(data.time, 270, 170);
  ctx.fillStyle='#8892a4'; ctx.font='14px Arial,sans-serif';
  ctx.fillText('TIEMPO TOTAL', 270, 195);

  // Mini mapa de ruta
  if (data.positions && data.positions.length>2) {
    const mx=510, my=88, mw=255, mh=150;
    ctx.fillStyle='rgba(37,37,53,0.85)';
    ctx.fillRect(mx,my,mw,mh);
    drawRouteMini(ctx,mx+18,my+18,mw-36,mh-36,data.positions);
  }

  // Stats (cuadrícula inferior)
  const statsY=268;
  const items=[
    {val:data.pace,     label:'RITMO /KM',    color:'#ff8c42'},
    {val:data.maxSpeed+' km/h', label:'VEL. MAX', color:'#ff8c42'},
    {val:data.cal+' kcal',  label:'CALORIAS',  color:'#ffd600'},
    {val:data.bpm,      label:'PULSO MEDIO',  color:'#ff4d6d'},
  ];
  const cellW=(W-56)/items.length;
  items.forEach((s,i)=>{
    const cx=28+i*cellW+cellW/2;
    if(i>0){
      ctx.strokeStyle='#252535'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(28+i*cellW,statsY-12); ctx.lineTo(28+i*cellW,statsY+52); ctx.stroke();
    }
    ctx.textAlign='center';
    ctx.fillStyle=s.color; ctx.font='bold 24px Arial,sans-serif';
    ctx.fillText(s.val||'–', cx, statsY+26);
    ctx.fillStyle='#8892a4'; ctx.font='11px Arial,sans-serif';
    ctx.fillText(s.label, cx, statsY+48);
  });
  ctx.textAlign='left';

  // Divisor inferior
  ctx.strokeStyle='#252535'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(28,348); ctx.lineTo(W-28,348); ctx.stroke();

  // Footer
  ctx.fillStyle='#8892a4'; ctx.font='12px Arial,sans-serif';
  ctx.fillText('gaetanomans92.github.io/running-tracker', 28, 372);

  // Franja naranja inferior
  ctx.fillStyle='#FC4C02'; ctx.fillRect(0,H-5,W,5);

  return cvs;
}

function drawRouteMini(ctx, x, y, w, h, positions) {
  if (positions.length<2) return;
  const lats=positions.map(p=>p.la), lons=positions.map(p=>p.ln);
  const minLat=Math.min(...lats), maxLat=Math.max(...lats);
  const minLon=Math.min(...lons), maxLon=Math.max(...lons);
  const ranLat=maxLat-minLat||0.001, ranLon=maxLon-minLon||0.001;
  const scale=Math.min(w/ranLon,h/ranLat)*0.85;
  const offX=(w-ranLon*scale)/2, offY=(h-ranLat*scale)/2;
  const tx=ln=>x+offX+(ln-minLon)*scale;
  const ty=la=>y+h-offY-(la-minLat)*scale;

  // Glow
  ctx.shadowColor='#FC4C02'; ctx.shadowBlur=10;
  ctx.strokeStyle='rgba(252,76,2,0.3)'; ctx.lineWidth=10;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  positions.forEach((p,i)=>i===0?ctx.moveTo(tx(p.ln),ty(p.la)):ctx.lineTo(tx(p.ln),ty(p.la)));
  ctx.stroke();

  // Línea
  ctx.shadowBlur=4; ctx.strokeStyle='#FC4C02'; ctx.lineWidth=3;
  ctx.beginPath();
  positions.forEach((p,i)=>i===0?ctx.moveTo(tx(p.ln),ty(p.la)):ctx.lineTo(tx(p.ln),ty(p.la)));
  ctx.stroke(); ctx.shadowBlur=0;

  // Inicio (verde)
  const s0=positions[0];
  ctx.fillStyle='#4caf50'; ctx.beginPath(); ctx.arc(tx(s0.ln),ty(s0.la),5,0,Math.PI*2); ctx.fill();
  // Fin (naranja)
  const s1=positions[positions.length-1];
  ctx.fillStyle='#FC4C02'; ctx.beginPath(); ctx.arc(tx(s1.ln),ty(s1.la),5,0,Math.PI*2); ctx.fill();
}

async function shareResult() {
  if (!lastRunData) return;
  const cvs = generateResultImage(lastRunData);
  cvs.toBlob(async blob => {
    const file = new File([blob],'carrera.png',{type:'image/png'});
    if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
      try { await navigator.share({files:[file], title:'Mi carrera', text:`${lastRunData.km} km en ${lastRunData.time}`}); return; }
      catch(_){}
    }
    // Fallback: descargar
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=`carrera_${new Date().toISOString().slice(0,10)}.png`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),10000);
  },'image/png');
}

// ─────────────────────────────────────────────────────────
// Pulso por cámara (PPG)
// ─────────────────────────────────────────────────────────
const HR={stream:null,animId:null,samples:[],WIN:270,MIN_DIST:12};

async function openHR() {
  primeVoice();
  document.getElementById('hr-modal').classList.add('show');
  document.getElementById('hr-bpm').textContent='–';
  document.getElementById('hr-msg').textContent='Cubre la cámara trasera con el dedo.';
  HR.samples=[];
  try {
    HR.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:'environment'},width:{ideal:160},height:{ideal:160}}});
  } catch(_) {
    try { HR.stream=await navigator.mediaDevices.getUserMedia({video:true}); }
    catch(e2) { document.getElementById('hr-msg').textContent='No se pudo acceder a la cámara.'; return; }
  }
  const vid=document.getElementById('hr-video'); vid.srcObject=HR.stream;
  try { await HR.stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:true}]}); } catch(_){}
  const cvs=document.getElementById('hr-canvas'), ctx=cvs.getContext('2d'); let fc=0;
  (function loop(){
    if(!HR.stream) return; HR.animId=requestAnimationFrame(loop);
    if(++fc%2!==0) return;
    ctx.drawImage(vid,0,0,144,144);
    const d=ctx.getImageData(52,52,40,40).data; let r=0;
    for(let i=0;i<d.length;i+=4) r+=d[i];
    HR.samples.push(r/(d.length/4));
    if(HR.samples.length>HR.WIN) HR.samples.shift();
    if(HR.samples.length>=45) detectBPM();
  })();
}
function detectBPM() {
  const sig=HR.samples, WS=12;
  const det=sig.map((v,i)=>{
    const lo=Math.max(0,i-WS),hi=Math.min(sig.length-1,i+WS);
    let s=0; for(let j=lo;j<=hi;j++) s+=sig[j]; return v-s/(hi-lo+1);
  });
  const pk=[];
  for(let i=1;i<det.length-1;i++)
    if(det[i]>det[i-1]&&det[i]>det[i+1]&&(!pk.length||i-pk[pk.length-1]>=HR.MIN_DIST)) pk.push(i);
  if(pk.length<2) return;
  const iv=[]; for(let i=1;i<pk.length;i++) iv.push(pk[i]-pk[i-1]);
  const bpm=Math.round(60/(iv.reduce((a,b)=>a+b,0)/iv.length/15));
  if(bpm<40||bpm>200) return;
  S.bpm=bpm; S.bpmSum+=bpm; S.bpmCount++;
  document.getElementById('hr-bpm').textContent=bpm;
  document.getElementById('s-bpm').textContent=bpm;
  document.getElementById('hr-msg').textContent=
    bpm<60?'Pulso bajo':bpm<100?'Normal':bpm<140?'Zona aeróbica':bpm<170?'Alta intensidad':'Muy alto';
}
function closeHR() {
  cancelAnimationFrame(HR.animId);
  if(HR.stream){HR.stream.getTracks().forEach(t=>t.stop());HR.stream=null;}
  document.getElementById('hr-modal').classList.remove('show');
}
